services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental_dev
      POSTGRES_PASSWORD: rental_dev_password
      POSTGRES_DB: rental_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_dev -d rental_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rental_dev:rental_dev_password@postgres:5432/rental_platform
      REDIS_URL: redis://redis:6379
      # Demo/dev only — see .env.example. A fixed OTP for the two seeded demo
      # accounts (npm run seed); ignored when NODE_ENV=production.
      DEMO_STATIC_OTP: "123456"
      DEMO_ACCOUNT_PHONES: "+237600000001,+237600000002"
      # Where the browser reaches this api's /media/* (public listing photos).
      API_PUBLIC_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./prisma:/app/prisma
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run start:dev --workspace=apps/api

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rental_dev:rental_dev_password@postgres:5432/rental_platform
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./prisma:/app/prisma
      - /app/apps/worker/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run start:dev --workspace=apps/worker
    # Only the visit-request expiry sweep actually lives here now — the
    # rent-expiry reminder scheduler, payment reconciliation, and
    # notification dispatch all run in-process inside `api` instead (see
    # README.md's tech-stack table), so they share its own event bus.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/v1
      # Demo/dev only: shows a "Demo accounts" helper on the sign-in page.
      NEXT_PUBLIC_SHOW_DEMO_LOGINS: "true"
      NEXT_PUBLIC_DEMO_OTP: "123456"
    ports:
      - "3001:3001"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - api
    command: npm run dev --workspace=apps/web
    # Demo frontend only — no Prisma/DB access, calls the api purely over
    # HTTP. NEXT_PUBLIC_API_URL is baked in at build/runtime for the
    # BROWSER to reach the api, so it's the host's own localhost:3000 (the
    # port docker-compose already publishes), not the "api" service name
    # docker's internal network would resolve.

volumes:
  postgres_data:
